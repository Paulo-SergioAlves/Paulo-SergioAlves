name: Update profile visuals

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate blue contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Paulo-SergioAlves
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%230284c7&color_dots=%23e2e8f0,%23bae6fd,%237dd3fc,%2338bdf8,%230284c7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2338bdf8&color_dots=%230b1220,%230c2a4a,%23075685,%230284c7,%2338bdf8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity graph from GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import os, json, urllib.request, datetime, html
          from pathlib import Path
          today = datetime.datetime.now(datetime.timezone.utc)
          start = (today - datetime.timedelta(days=29)).replace(hour=0, minute=0, second=0, microsecond=0)
          query = """query($user:String!, $from:DateTime!, $to:DateTime!) {
            user(login:$user) { contributionsCollection(from:$from,to:$to) {
              contributionCalendar { weeks { contributionDays { date contributionCount } } }
            } }
          }"""
          payload = json.dumps({"query": query, "variables": {
            "user": "Paulo-SergioAlves", "from": start.isoformat(), "to": today.isoformat()
          }}).encode()
          req = urllib.request.Request("https://api.github.com/graphql", data=payload, headers={
            "Authorization": "Bearer " + os.environ["GH_TOKEN"],
            "Content-Type": "application/json", "User-Agent": "profile-visuals"
          })
          with urllib.request.urlopen(req, timeout=40) as response:
            data = json.load(response)
          if data.get("errors"):
            raise RuntimeError("GitHub contribution query failed: " + str(data["errors"]))
          weeks = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]
          days = sorted([d for w in weeks for d in w["contributionDays"]
            if start.date().isoformat() <= d["date"] <= today.date().isoformat()], key=lambda d:d["date"])
          if not days:
            raise RuntimeError("No contribution calendar returned")
          peak = max(1, max(d["contributionCount"] for d in days))
          parts = ['<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Contribuições diárias dos últimos 30 dias">',
            '<rect width="1000" height="300" rx="14" fill="#0b1220"/>',
            '<g font-family="monospace"><text x="38" y="39" fill="#38bdf8" font-size="18">CONTRIBUTION ACTIVITY / 30 DIAS</text>']
          for level in range(5):
            y = 230 - level * 40
            parts.append(f'<path d="M45 {y}H960" stroke="#17365a"/><text x="12" y="{y+4}" fill="#94a3b8" font-size="11">{peak*level/4:g}</text>')
          points = []
          for i, day in enumerate(days):
            x = 50 + i * 900 / max(1,len(days)-1)
            y = 230 - day["contributionCount"] / peak * 160
            points.append(f'{x:.1f},{y:.1f}')
            label = html.escape(day['date'] + ': ' + str(day['contributionCount']) + ' contribuições')
            parts.append(f'<circle cx="{x:.1f}" cy="{y:.1f}" r="3" fill="#7dd3fc"><title>{label}</title></circle>')
            if i % 7 == 0 or i == len(days)-1:
              parts.append(f'<text x="{x:.1f}" y="255" text-anchor="middle" fill="#94a3b8" font-size="11">{day["date"][8:10]}/{day["date"][5:7]}</text>')
          parts.append('<polyline points="' + ' '.join(points) + '" fill="none" stroke="#38bdf8" stroke-width="2"/>')
          parts.append('</g></svg>')
          Path("dist").mkdir(exist_ok=True)
          Path("dist/activity.svg").write_text(''.join(parts))

      - name: Generate public statistics and languages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import os, json, urllib.request, datetime, html
          from pathlib import Path
          from collections import defaultdict
          
          def gql(query, variables):
              request = urllib.request.Request("https://api.github.com/graphql",
                  data=json.dumps({"query": query, "variables": variables}).encode(),
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Content-Type": "application/json", "User-Agent": "profile-visuals"})
              with urllib.request.urlopen(request, timeout=40) as response:
                  result = json.load(response)
              if result.get("errors"):
                  raise RuntimeError(str(result["errors"]))
              return result["data"]["user"]
          
          query = """query($user:String!, $cursor:String) {
            user(login:$user) {
              repositories(first:100,after:$cursor,privacy:PUBLIC,isFork:false,ownerAffiliations:OWNER) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  stargazerCount
                  languages(first:100) { edges { size node { name color } } }
                }
              }
              contributionsCollection {
                totalCommitContributions totalPullRequestContributions
                totalIssueContributions totalPullRequestReviewContributions
              }
            }
          }"""
          repos = []
          cursor = None
          while True:
              user = gql(query, {"user": "Paulo-SergioAlves", "cursor": cursor})
              connection = user["repositories"]
              repos.extend(connection["nodes"])
              if not connection["pageInfo"]["hasNextPage"]:
                  break
              cursor = connection["pageInfo"]["endCursor"]
          contributions = user["contributionsCollection"]
          languages = defaultdict(int)
          colors = {}
          for repo in repos:
              for edge in repo["languages"]["edges"]:
                  name = edge["node"]["name"]
                  languages[name] += edge["size"]
                  colors[name] = edge["node"]["color"] or "#38bdf8"
          
          def text(x, y, content, size=17, color="#cbd5e1", weight="400"):
              return f'<text x="{x}" y="{y}" fill="{color}" font-size="{size}" font-weight="{weight}">{html.escape(str(content))}</text>'
          
          def card(title, subtitle, height):
              return [
                f'<svg xmlns="http://www.w3.org/2000/svg" width="520" height="{height}" viewBox="0 0 520 {height}" role="img" aria-label="{html.escape(title)}">',
                f'<rect width="520" height="{height}" rx="14" fill="#0b1220"/>',
                '<g font-family="Arial, sans-serif">',
                text(28, 40, title, 21, "#38bdf8", "700"),
                text(28, 65, subtitle, 12, "#94a3b8")
              ]
          
          parts = card("Estatísticas do GitHub", "Paulo Sérgio · Repositórios públicos próprios, sem forks", 310)
          rows = [
              ("Estrelas recebidas", sum(r["stargazerCount"] for r in repos)),
              ("Repositórios públicos", len(repos)),
              ("Commits · últimos 12 meses", contributions["totalCommitContributions"]),
              ("Pull requests · últimos 12 meses", contributions["totalPullRequestContributions"]),
              ("Issues · últimos 12 meses", contributions["totalIssueContributions"]),
              ("Revisões de PRs · últimos 12 meses", contributions["totalPullRequestReviewContributions"])
          ]
          for i, (label, value) in enumerate(rows):
              y = 104 + i * 34
              parts.append(text(28, y, label, 16))
              parts.append(text(450, y, value, 18, "#f0f9ff", "700"))
          parts.append('</g></svg>')
          Path("dist").mkdir(exist_ok=True)
          Path("dist/stats.svg").write_text("".join(parts))
          
          ranked = sorted(languages.items(), key=lambda item: (-item[1], item[0]))
          if len(ranked) > 6:
              shown = ranked[:5] + [("Outras", sum(size for _, size in ranked[5:]))]
          else:
              shown = ranked
          total = sum(languages.values())
          parts = card("Linguagens nos repositórios", "Distribuição por bytes de código · Repositórios públicos, sem forks", 310)
          if total:
              x = 28
              for name, size in shown:
                  width = 464 * size / total
                  color = colors.get(name, "#64748b")
                  parts.append(f'<rect x="{x:.2f}" y="85" width="{width:.2f}" height="12" fill="{color}"/>')
                  x += width
              for i, (name, size) in enumerate(shown):
                  y = 129 + i * 28
                  color = colors.get(name, "#64748b")
                  parts.append(f'<circle cx="34" cy="{y-5}" r="5" fill="{color}"/>')
                  parts.append(text(49, y, name, 16))
                  parts.append(text(421, y, f"{100*size/total:.1f}%".replace(".", ","), 16, "#f0f9ff"))
          else:
              parts.append(text(28, 124, "Nenhuma linguagem detectada ainda.", 16))
          parts.append('</g></svg>')
          Path("dist/languages.svg").write_text("".join(parts))
          print("Generated stats.svg and languages.svg from public GitHub data.")

      - name: Generate trophies locally with official action
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: Paulo-SergioAlves
          output_path: dist/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: algolia

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
